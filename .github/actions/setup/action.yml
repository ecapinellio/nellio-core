name: Setup
description: pnpm + Node + dependencies; optionally the local Supabase stack with its env vars exported.

inputs:
  supabase:
    description: Start the local Supabase stack (migrations applied) and export its keys.
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

    - if: inputs.supabase == 'true'
      uses: supabase/setup-cli@v1
      with:
        version: latest

    # No secrets: `supabase start` generates fresh demo keys for an ephemeral
    # local stack that never touches a real project.
    - if: inputs.supabase == 'true'
      shell: bash
      run: |
        # Tests don't use these. Fewer containers = fewer host ports that can
        # collide with the runner's ephemeral ports (mailpit's 54324 did).
        EXCLUDE=studio,mailpit,imgproxy,edge-runtime,logflare,vector
        # A port taken by another process on the runner fails the start; retry.
        for attempt in 1 2 3; do
          supabase start -x "$EXCLUDE" && break
          [ "$attempt" = 3 ] && exit 1
          supabase stop --no-backup || true
          sleep 5
        done
        STATUS=$(supabase status -o json)
        echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$STATUS" | jq -r .API_URL)" >> "$GITHUB_ENV"
        echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS" | jq -r .ANON_KEY)" >> "$GITHUB_ENV"
        echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | jq -r .SERVICE_ROLE_KEY)" >> "$GITHUB_ENV"
